<!-- sponsors.html — página de patrocinadores: texto e lista provisória -->
    <div class="pagina-topo">
      <div class="conteudo">
        <h1 class="entra">{{t.sponsors.h1}}</h1>
        <p class="entra atraso-1">{{t.sponsors.intro}}</p>
      </div>
    </div>

    <section class="conteudo" aria-labelledby="apoio-titulo">
      <h2 id="apoio-titulo" class="entra atraso-2">{{t.sponsors.listHeading}}</h2>
      <!--
        Lista provisória. Para cada patrocinador real, trocar o texto pelo nome
        ou por <img src="/img/patrocinador-x.svg" alt="Nome do patrocinador">.
        alt descritivo obrigatório se a imagem informa; alt="" se for decorativa.
      -->
      <ul class="patrocinadores entra atraso-3">
        {{{sponsorItems}}}
      </ul>
    </section>
