      </div>
      <a class="cabeca-inscricao cabeca-inscricao-topo" href="{{url.volunteer}}#inscricao">{{t.volunteer.signNow}}</a>
    </header>

    <div class="visor" id="visor-educativa" role="dialog" aria-modal="true" aria-labelledby="visor-educativa-legenda" hidden>
      <div class="faixa" aria-hidden="true"></div>
      <button class="visor-fechar" type="button"><span class="oculto-visual">{{t.educational.gallery.close}}</span></button>
      <div class="visor-corpo">
        <button class="slide-seta slide-anterior visor-anterior" type="button" aria-label="{{t.educational.gallery.prev}}"></button>
        <figure class="visor-figura">
          <img class="visor-foto" alt="" hidden>
          <video class="visor-filme" controls playsinline hidden></video>
          <figcaption class="visor-legenda" id="visor-educativa-legenda" aria-live="polite"></figcaption>
        </figure>
        <button class="slide-seta slide-proximo visor-proximo" type="button" aria-label="{{t.educational.gallery.next}}"></button>
      </div>
      <div class="visor-faixa" aria-label="{{t.educational.gallery.thumbs}}"></div>
    </div>
