<!-- volunteer.html — voluntariado: texto do cliente, espaço para vídeo/foto/áudio dos voluntários e formulário ao Formspree -->
    <div class="pagina-topo">
      <div class="conteudo">
        <h1 class="entra">{{t.volunteer.h1}}</h1>
        <div class="intro entra atraso-1">
          {{{volunteerIntro}}}
        </div>
      </div>
    </div>

    <div class="caixas entra atraso-2">
      <section class="caixa">
        <h2 class="caixa-titulo"><button class="caixa-botao" type="button" id="caixa-volunteer-2-botao" aria-expanded="true" aria-controls="caixa-volunteer-2">{{t.volunteer.media.title}}</button></h2>
        <div class="caixa-painel" id="caixa-volunteer-2" role="region" aria-labelledby="caixa-volunteer-2-botao">
          <p>{{t.volunteer.media.intro}}</p>
          <!-- Lugares vazios. Cada um vira um player ou uma galeria quando o arquivo chegar. Sem arquivo, só o aviso. -->
          <ul class="vazios">
            <li><strong>{{t.volunteer.media.video}}</strong><span>{{t.volunteer.media.pending}}</span></li>
            <li><strong>{{t.volunteer.media.photos}}</strong><span>{{t.volunteer.media.pending}}</span></li>
            <li><strong>{{t.volunteer.media.audio}}</strong><span>{{t.volunteer.media.pending}}</span></li>
          </ul>
        </div>
      </section>

      <section class="caixa">
        <h2 class="caixa-titulo"><button class="caixa-botao" type="button" id="caixa-volunteer-3-botao" aria-expanded="true" aria-controls="caixa-volunteer-3">{{t.volunteer.form.heading}}</button></h2>
        <div class="caixa-painel" id="caixa-volunteer-3" role="region" aria-labelledby="caixa-volunteer-3-botao">
          <div id="form-alerta" class="alerta" role="alert" tabindex="-1" hidden></div>
          <div id="form-estado" class="estado" aria-live="polite" tabindex="-1" hidden></div>

          <form
            id="form-voluntario"
            class="formulario"
            action="https://formspree.io/f/{{formspreeId}}"
            method="POST"
            data-ativo="{{voluntarioAtivo}}"
            data-msg-required="{{t.volunteer.form.errRequired}}"
            data-msg-email="{{t.volunteer.form.errEmail}}"
            data-msg-network="{{t.volunteer.form.errNetwork}}"
            data-msg-summary="{{t.volunteer.form.summary}}"
            data-msg-sending="{{t.volunteer.form.sending}}"
            data-msg-success="{{t.volunteer.form.success}}"
            data-msg-inactive="{{t.volunteer.form.inactive}}"
          >
            <p class="nota-obrigatorio">{{t.volunteer.form.requiredNote}}</p>
            <input type="hidden" name="_language" value="{{htmlLang}}">

            <div class="campo">
              <label for="f-nome">{{t.volunteer.form.name}} <span class="req">({{t.required}})</span></label>
              <input id="f-nome" name="name" type="text" required autocomplete="name" aria-describedby="f-nome-erro">
              <p id="f-nome-erro" class="campo-erro" hidden></p>
            </div>

            <div class="campo">
              <label for="f-email">{{t.volunteer.form.email}} <span class="req">({{t.required}})</span></label>
              <input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email" aria-describedby="f-email-erro">
              <p id="f-email-erro" class="campo-erro" hidden></p>
            </div>

            <div class="campo">
              <label for="f-tarefa">{{t.volunteer.form.task}} <span class="req">({{t.required}})</span></label>
              <select id="f-tarefa" name="task" required aria-describedby="f-tarefa-erro">
                <option value="">{{t.volunteer.form.taskChoose}}</option>
                <option value="clearing and shaping trails">{{t.volunteer.form.taskTrails}}</option>
                <option value="moving stones">{{t.volunteer.form.taskStones}}</option>
                <option value="gardening">{{t.volunteer.form.taskGardening}}</option>
                <option value="general grounds maintenance">{{t.volunteer.form.taskGrounds}}</option>
              </select>
              <p id="f-tarefa-erro" class="campo-erro" hidden></p>
            </div>

            <div class="campo">
              <label for="f-mensagem">{{t.volunteer.form.message}} <span class="req">({{t.required}})</span></label>
              <textarea id="f-mensagem" name="message" rows="6" required aria-describedby="f-mensagem-erro"></textarea>
              <p id="f-mensagem-erro" class="campo-erro" hidden></p>
            </div>

            <!-- Honeypot anti-spam: invisível e fora da ordem de tabulação. Humanos não preenchem. -->
            <div class="hp" aria-hidden="true">
              <label for="f-gotcha">{{t.volunteer.form.honeypot}}</label>
              <input id="f-gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
            </div>

            <button class="botao maiusculas" type="submit">{{t.volunteer.form.submit}}</button>
          </form>
        </div>
      </section>
    </div>
