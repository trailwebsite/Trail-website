<!-- donations.html — cabeçalho com foto, Google Form no box aberto e contas no centro -->
    <header class="cabeca">
      <picture class="cabeca-foto" data-edit-key="img.donations.cabeca" data-edit-type="image" data-alt-key="t.donations.heroAlt">
        <source type="image/webp" srcset="/img/cabeca-doacao.webp">
        <img src="/img/cabeca-doacao.jpg" width="1920" height="590" alt="{{t.donations.heroAlt}}">
      </picture>
      <div class="cabeca-texto">
        <h1 class="cabeca-titulo">{{t.donations.h1}}</h1>
        <p class="cabeca-frase">{{t.donations.heroLine}}</p>
      </div>
    </header>

    <div class="pagina-topo">
      <div class="conteudo">
        <p class="entra atraso-1">{{t.donations.lead}}</p>
        <p>{{t.donations.choice}}</p>
        <p>{{t.donations.noneYet}}</p>
      </div>
    </div>

    <div class="conteudo form-direto entra atraso-2">
      <section class="caixa tema caixa-fix" id="formulario-doacao">
        <h2 class="caixa-titulo caixa-titulo-fix">{{t.donations.form.heading}}</h2>
        <div class="caixa-painel">
          <iframe
            class="form-google"
            title="{{t.donations.form.heading}}"
            src="{{googleFormDoacao}}"
          ></iframe>
        </div>
      </section>

      <section id="contas-doacao" class="contas-doacao" data-falha="{{t.donations.bank.copyFail}}">
        <h2 id="contas-titulo" class="secao-titulo" tabindex="-1">{{t.donations.bank.revealed}}</h2>
        <p id="copia-dica" class="dica">{{t.donations.bank.hint}}</p>
        <p id="copia-estado" class="estado" aria-live="polite" hidden></p>

        <h3>{{t.donations.bank.soles}}</h3>
        <div class="copia-par" role="group" aria-label="{{t.donations.bank.groupSoles}}" aria-describedby="copia-dica">
          <button class="botao botao-leve botao-copia" type="button" data-numero="{{contas.soles.bcp}}" data-numero-chave="contas.soles.bcp" data-copiado="{{t.donations.bank.copiedSolesBcp}}">
            <span class="copia-banco">{{t.donations.bank.bcp}}</span>
            <span class="copia-numero" data-edit-key="contas.soles.bcp" data-edit-type="text">{{contas.soles.bcp}}</span>
          </button>
          <button class="botao botao-leve botao-copia" type="button" data-numero="{{contas.soles.interbancaria}}" data-numero-chave="contas.soles.interbancaria" data-copiado="{{t.donations.bank.copiedSolesInter}}">
            <span class="copia-banco">{{t.donations.bank.interbank}}</span>
            <span class="copia-numero" data-edit-key="contas.soles.interbancaria" data-edit-type="text">{{contas.soles.interbancaria}}</span>
          </button>
        </div>

        <h3>{{t.donations.bank.dolares}}</h3>
        <div class="copia-par" role="group" aria-label="{{t.donations.bank.groupDollars}}" aria-describedby="copia-dica">
          <button class="botao botao-leve botao-copia" type="button" data-numero="{{contas.dolares.bcp}}" data-numero-chave="contas.dolares.bcp" data-copiado="{{t.donations.bank.copiedDollarsBcp}}">
            <span class="copia-banco">{{t.donations.bank.bcp}}</span>
            <span class="copia-numero" data-edit-key="contas.dolares.bcp" data-edit-type="text">{{contas.dolares.bcp}}</span>
          </button>
          <button class="botao botao-leve botao-copia" type="button" data-numero="{{contas.dolares.interbancaria}}" data-numero-chave="contas.dolares.interbancaria" data-copiado="{{t.donations.bank.copiedDollarsInter}}">
            <span class="copia-banco">{{t.donations.bank.interbank}}</span>
            <span class="copia-numero" data-edit-key="contas.dolares.interbancaria" data-edit-type="text">{{contas.dolares.interbancaria}}</span>
          </button>
        </div>
      </section>
    </div>
