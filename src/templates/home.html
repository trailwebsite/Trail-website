<!-- home.html — página inicial: cartaz do cliente no hero, h1 só para leitor de tela e três caixas de texto -->
    <div class="hero">
      <div class="hero-interno">
        <h1 class="oculto-visual">{{siteName}}</h1>
        <picture class="hero-cartaz entra">
          <source type="image/webp" srcset="{{cartaz.webp}}">
          <img src="{{cartaz.jpg}}" width="{{cartaz.largura}}" height="{{cartaz.altura}}" alt="{{t.home.heroAlt}}" fetchpriority="high">
        </picture>
        <p class="hero-frase entra atraso-1">{{t.home.tagline}}</p>
      </div>
    </div>

    <div class="caixas entra atraso-2">
      {{{caixa.0}}}
      {{{caixa.1}}}
      {{{caixa.2}}}
    </div>
