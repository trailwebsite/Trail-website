<!-- home.html — página inicial: cartaz, aviso de construção, chamado de voluntários e três caixas -->
    <div class="hero">
      <div class="hero-interno">
        <h1 class="oculto-visual">{{siteName}}</h1>
        <div class="hero-cartaz entra">
          <picture data-edit-key="img.home.cartaz" data-edit-type="image" data-alt-key="t.home.heroAlt">
            <source type="image/webp" srcset="{{cartaz.webp}}">
            <img src="{{cartaz.jpg}}" width="{{cartaz.largura}}" height="{{cartaz.altura}}" alt="{{t.home.heroAlt}}" fetchpriority="high">
          </picture>
          <a class="cabeca-inscricao hero-inscricao" href="{{url.volunteer}}#inscricao">{{t.volunteer.signNow}}</a>
        </div>
        <p class="hero-frase entra atraso-1">{{t.home.tagline}}</p>
      </div>
    </div>

    <div class="conteudo miolo">
      <div class="aviso entra atraso-1">
        <div class="faixa" aria-hidden="true"></div>
        <p>{{t.home.banner}}</p>
      </div>
      <div class="intro entra atraso-2">
        {{{apelo}}}
      </div>
    </div>

    <div class="caixas entra atraso-2">
      {{{caixa.0}}}
      {{{caixa.1}}}
      {{{caixa.2}}}
    </div>
