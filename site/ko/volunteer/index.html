  <main id="contenido" tabindex="-1">
<!-- volunteer.html — página de voluntariado: texto e formulário enviado ao Formspree -->
    <div class="pagina-topo">
      <div class="conteudo">
        <h1 class="entra">도움 주는 방법</h1>
        <p class="entra atraso-1">자원봉사자로 참여하여 시간, 지식 또는 손길을 보호구역 돌봄에 보탤 수 있습니다. 어떻게 돕고 싶은지 알려주시면 연락드리겠습니다.</p>
      </div>
    </div>

    <section class="conteudo" aria-labelledby="form-titulo">
      <h2 id="form-titulo" class="entra atraso-2">자원봉사 신청</h2>

      <div id="form-alerta" class="alerta" role="alert" tabindex="-1" hidden></div>
      <div id="form-estado" class="estado" aria-live="polite" tabindex="-1" hidden></div>

      <form
        id="form-voluntario"
        class="formulario entra atraso-3"
        action="https://formspree.io/f/FORMSPREE_ID"
        method="POST"
        data-msg-required="필수 항목입니다."
        data-msg-email="올바른 이메일 주소를 입력해 주세요. 예: name@example.com"
        data-msg-network="메시지를 보내지 못했습니다. 연결을 확인하고 다시 시도해 주세요."
        data-msg-summary="양식을 보낼 수 없습니다. 오류가 표시된 항목을 확인해 주세요."
        data-msg-sending="보내는 중…"
        data-msg-success="감사합니다. 메시지를 받았으며 곧 연락드리겠습니다."
      >
        <p class="nota-obrigatorio">모든 항목은 필수입니다.</p>
        <input type="hidden" name="_language" value="ko">

        <div class="campo">
          <label for="f-nome">이름 <span class="req">(필수)</span></label>
          <input id="f-nome" name="nombre" type="text" required autocomplete="name" aria-describedby="f-nome-erro">
          <p id="f-nome-erro" class="campo-erro" hidden></p>
        </div>

        <div class="campo">
          <label for="f-email">이메일 <span class="req">(필수)</span></label>
          <input id="f-email" name="email" type="email" required autocomplete="email" inputmode="email" aria-describedby="f-email-erro">
          <p id="f-email-erro" class="campo-erro" hidden></p>
        </div>

        <div class="campo">
          <label for="f-ajuda">어떻게 돕고 싶으신가요 <span class="req">(필수)</span></label>
          <select id="f-ajuda" name="ayuda" required aria-describedby="f-ajuda-erro">
            <option value="">선택하세요</option>
            <option value="tiempo">시간을 내어</option>
            <option value="conocimientos">지식을 나누어</option>
            <option value="manos">직접 손으로</option>
          </select>
          <p id="f-ajuda-erro" class="campo-erro" hidden></p>
        </div>

        <div class="campo">
          <label for="f-mensagem">메시지 <span class="req">(필수)</span></label>
          <textarea id="f-mensagem" name="mensaje" rows="6" required aria-describedby="f-mensagem-erro"></textarea>
          <p id="f-mensagem-erro" class="campo-erro" hidden></p>
        </div>

        <!-- Honeypot anti-spam: invisível e fora da ordem de tabulação. Humanos não preenchem. -->
        <div class="hp" aria-hidden="true">
          <label for="f-gotcha">Deja este campo vacío</label>
          <input id="f-gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
        </div>

        <button class="botao maiusculas" type="submit">메시지 보내기</button>
      </form>
    </section>

  </main>
